57" text-anchor="start">不必重做</text><rect x="467.0" y="424" width="248.0" height="52" rx="26" fill="#BF181F"/><text x="591.0" y="459.0" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">各機設定不用重做</text><rect x="731.0" y="424" width="298.0" height="52" rx="26" fill="#FFFFFF"/><text x="880.0" y="459.0" font-size="25" font-weight="700" fill="#1F3864" text-anchor="middle">加一台＝裝代理再納管</text><rect x="1045.0" y="424" width="198.0" height="52" rx="26" fill="#FFFFFF"/><text x="1144.0" y="459.0" font-size="25" font-weight="700" fill="#1F3864" text-anchor="middle">總覽一頁看完</text><rect x="20" y="510" width="1430" height="100" rx="18" fill="#E8EDF3"/><text x="44" y="558.0" font-size="32" font-weight="700" fill="#1F3864" text-anchor="start">資源上限</text><text x="44" y="594.0" font-size="23" font-weight="400" fill="#3D4A57" text-anchor="start">不壓垮機器</text><rect x="456.375" y="534" width="288.0" height="52" rx="26" fill="#FFFFFF"/><text x="600.375" y="569.0" font-size="25" font-weight="700" fill="#1F3864" text-anchor="middle">主控台記憶體512 MiB</text><rect x="760.375" y="534" width="237.99999999999997" height="52" rx="26" fill="#FFFFFF"/><text x="879.375" y="569.0" font-size="25" font-weight="700" fill="#1F3864" text-anchor="middle">節點代理256 MiB</text><rect x="1014.375" y="534" width="239.25" height="52" rx="26" fill="#FFFFFF"/><text x="1134.0" y="569.0" font-size="25" font-weight="700" fill="#1F3864" text-anchor="middle">CPU使用量設上限</text></svg>