" y="82" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="start">同一台AI機</text><text x="352.0" y="122" font-size="24" font-weight="400" fill="#D5E3F3" text-anchor="start">主控台與節點代理</text><rect x="664.6666666666667" y="24" width="380.6666666666667" height="142" rx="12" fill="#2B6CB5"/><g transform="translate(686.6666666666667,50) scale(1.6666666666666667)"><path d="M12 3 L19 6 V11 C19 16 16 19.5 12 21 C8 19.5 5 16 5 11 V6 Z M9 12 l2 2 l4 -4" fill="none" stroke="#FFFFFF" stroke-width="1.76" stroke-linecap="round" stroke-linejoin="round"/></g><text x="746.6666666666667" y="82" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="start">第一次開機</text><text x="746.6666666666667" y="122" font-size="24" font-weight="400" fill="#D5E3F3" text-anchor="start">就是HTTPS</text><rect x="1059.3333333333335" y="24" width="380.6666666666667" height="142" rx="12" fill="#2B6CB5"/><g transform="translate(1081.3333333333335,50) scale(1.6666666666666667)"><path d="M9 11 a3 3 0 1 0 0.01 0 Z M3 20 c0-3.5 2.7-6 6-6 s6 2.5 6 6 M16 11 a2.5 2.5 0 1 0 0.01 0 M15 14.5 c3 0 6 2 6 5.5" fill="none" stroke="#FFFFFF" stroke-width="1.76" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1141.3333333333335" y="82" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="start">開瀏覽器就用</text><text x="1141.3333333333335" y="122" font-size="24" font-weight="400" fill="#D5E3F3" text-anchor="start">不必另備管理機</text><rect x="20" y="190" width="1430" height="200" rx="18" fill="#C9D9E9"/><text x="44" y="288.0" font-size="32" font-weight="700" fill="#1F3864" text-anchor="start">多機模式</text><text x="44" y="324.0" font-size="23" font-weight="400" fill="#3D4A57" text-anchor="start">機器變多時</text><rect x="270.0" y="204" width="282.0" height="172" rx="12" fill="#FFFFFF"/><g transform="translate(290.0,224) scale(1.5833333333333333)"><path d="M3 9 h18 M5 9 v10 M19 9 v10 M8 5 h8 v4 H8 Z" fill="none" stroke="#2E7BC4" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round"/></g><text x="3