<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" width="1500" height="760" font-family="Noto Sans TC, Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif"><rect width="1500" height="760" fill="#F7F8FA"/><rect x="20" y="10" width="650" height="520" rx="18" fill="#E6E8EB"/><text x="52" y="62" font-size="29" font-weight="700" fill="#4A5561" text-anchor="start">以前：靠一兩位會指令的工程師</text><rect x="48" y="92" width="594" height="128" rx="12" fill="#FFFFFF"/><g transform="translate(72,130) scale(2.0833333333333335)"><path d="M4 15 a8 8 0 0 1 16 0 M12 15 L16 9 M4 19 H20" fill="none" stroke="#8A95A1" stroke-width="1.41" stroke-linecap="round" stroke-linejoin="round"/></g><text x="148" y="146" font-size="27" font-weight="700" fill="#4A5561" text-anchor="start">開下去才知道夠不夠</text><text x="148" y="188" font-size="21" font-weight="400" fill="#8A95A1" text-anchor="start">吃爆就整台卡死，到機房重開</text><rect x="48" y="236" width="594" height="128" rx="12" fill="#FFFFFF"/><g transform="translate(72,274) scale(2.0833333333333335)"><path d="M6 3 h12 v18 H6 Z M6 8 h12 M6 13 h12 M9 5.5 h2 M9 10.5 h2 M9 15.5 h2" fill="none" stroke="#8A95A1" stroke-width="1.41" stroke-linecap="round" stroke-linejoin="round"/></g><text x="148" y="290" font-size="27" font-weight="700" fill="#4A5561" text-anchor="start">換模型要連進機器</text><text x="148" y="332" font-size="21" font-weight="400" fill="#8A95A1" text-anchor="start">改設定檔、重啟，失敗就停擺</text><rect x="48" y="380" width="594" height="128" rx="12" fill="#FFFFFF"/><g transform="translate(72,418) scale(2.0833333333333335)"><path d="M6 3 h8 l4 4 v14 H6 Z M14 3 v4 h4 M9 12 h6 M9 16 h6" fill="none" stroke="#8A95A1" stroke-width="1.41" stroke-linecap="round" stroke-linejoin="round"/></g><text x="148" y="434" font-size="27" font-weight="700" fill="#4A5561" text-anchor="start">狀態記在個人筆記</text><text x="148" y="476" font-size="21" font-weight="400" fill="#8A95A1" text-anchor="start">哪台跑什麼、網址多少要問人</text></svg>