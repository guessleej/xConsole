<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" width="1500" height="760" font-family="Noto Sans TC, Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif"><rect width="1500" height="760" fill="#F7F8FA"/><rect x="20" y="10" width="650" height="520" rx="18" fill="#E6E8EB"/><text x="52" y="62" font-size="29" font-weight="700" fill="#4A5561" text-anchor="start">以前：靠一兩位會指令的工程師</text><rect x="48" y="92" width="594" height="128" rx="12" fill="#FFFFFF"/><g transform="translate(72,130) scale(2.0833333333333335)"><path d="M4 15 a8 8 0 0 1 16 0 M12 15 L16 9 M4 19 H20" fill="none" stroke="#8A95A1" stroke-width="1.41" stroke-linecap="round" stroke-linejoin="round"/></g><text x="148" y="146" font-size="27" font-weight="700" fill="#4A5561" text-anchor="start">開下去才知道夠不夠</text><text x="148" y="188" font-size="21" font-weight="400" fill="#8A95A1" text-anchor="start">吃爆就整台卡死，到機房重開</text><rect x="48" y="236" width="594" height="128" rx="12" fill="#FFFFFF"/><g transform="translate(72,274) scale(2.0833333333333335)"><path d="M6 3 h12 v18 H6 Z M6 8 h12 M6 13 h12 M9 5.5 h2 M9 10.5 h2 M9 15.5 h2" fill="none" stroke="#8A95A1" stroke-width="1.41" stroke-linecap="round" stroke-linejoin="round"/></g><text x="148" y="290" font-size="27" font-weight="700" fill="#4A5561" text-anchor="start">換模型要連進機器</text><text x="148" y="332" font-size="21" font-weight="400" fill="#8A95A1" text-anchor="start">改設定檔、重啟，失敗就停擺</text><rect x="48" y="380" width="594" height="128" rx="12" fill="#FFFFFF"/><g transform="translate(72,418) scale(2.0833333333333335)"><path d="M6 3 h8 l4 4 v14 H6 Z M14 3 v4 h4 M9 12 h6 M9 16 h6" fill="none" stroke="#8A95A1" stroke-width="1.41" stroke-linecap="round" stroke-linejoin="round"/></g><text x="148" y="434" font-size="27" font-weight="700" fill="#4A5561" text-anchor="start">狀態記在個人筆記</text><text x="148" y="476" font-size="21" font-weight="400" fill="#8A95A1" text-anchor="start">哪台跑什麼、網址多少要問人</text><path d="M690 220 H740 V180 L810 270 L740 360 V320 H690 Z" fill="#1F5FA8"/><rect x="830" y="10" width="650" height="520" rx="18" fill="#DCE8F4"/><text x="862" y="62" font-size="29" font-weight="700" fill="#1F3864" text-anchor="start">xConsole：一個網頁收起來</text><rect x="858" y="92" width="594" height="128" rx="12" fill="#FFFFFF"/><g transform="translate(882,130) scale(2.0833333333333335)"><path d="M12 3 L19 6 V11 C19 16 16 19.5 12 21 C8 19.5 5 16 5 11 V6 Z M9 12 l2 2 l4 -4" fill="none" stroke="#2E7BC4" stroke-width="1.41" stroke-linecap="round" stroke-linejoin="round"/></g><text x="958" y="146" font-size="27" font-weight="700" fill="#1F3864" text-anchor="start">載入前先試算</text><text x="958" y="188" font-size="21" font-weight="400" fill="#3D4A57" text-anchor="start">最壞剩多少不夠，就擋下來</text><rect x="858" y="236" width="594" height="128" rx="12" fill="#FFFFFF"/><g transform="translate(882,274) scale(2.0833333333333335)"><path d="M12 3 L20 7.5 V16.5 L12 21 L4 16.5 V7.5 Z M4 7.5 L12 12 L20 7.5 M12 12 V21" fill="none" stroke="#2E7BC4" stroke-width="1.41" stroke-linecap="round" stroke-linejoin="round"/></g><text x="958" y="290" font-size="27" font-weight="700" fill="#1F3864" text-anchor="start">網頁上換模型</text><text x="958" y="332" font-size="21" font-weight="400" fill="#3D4A57" text-anchor="start">起不來自動換回原本那顆</text><rect x="858" y="380" width="594" height="128" rx="12" fill="#FFFFFF"/><g transform="translate(882,418) scale(2.0833333333333335)"><path d="M8 3 V8 M16 3 V8 M6 8 H18 V12 a6 6 0 0 1 -12 0 Z M12 18 V21" fill="none" stroke="#2E7BC4" stroke-width="1.41" stroke-linecap="round" stroke-linejoin="round"/></g><text x="958" y="434" font-size="27" font-weight="700" fill="#1F3864" text-anchor="start">串接資訊一頁看完</text><text x="958" y="476" font-size="21" font-weight="400" fill="#3D4A57" text-anchor="start">範例直接複製，按一下實測</text><rect x="20" y="550" width="1460" height="200" rx="18" fill="#FFFFFF"/><text x="200" y="664" text-anchor="middle"><tspan font-size="68" font-weight="800" fill="#1F3864">214</tspan><tspan font-size="26" fill="#8A95A1" dx="8">項</tspan></text><text x="200" y="712" font-size="22" font-weight="400" fill="#8A95A1" text-anchor="middle">自動化測試全數通過</text><line x1="383" y1="584" x2="383" y2="716" stroke="#C6D4E2" stroke-width="2"/><text x="565" y="664" text-anchor="middle"><tspan font-size="68" font-weight="800" fill="#BF181F">52</tspan><tspan font-size="26" fill="#8A95A1" dx="8">項</tspan></text><text x="565" y="712" font-size="22" font-weight="400" fill="#8A95A1" text-anchor="middle">攻擊式安全測試全數通過</text><line x1="748" y1="584" x2="748" y2="716" stroke="#C6D4E2" stroke-width="2"/><text x="930" y="664" text-anchor="middle"><tspan font-size="68" font-weight="800" fill="#1F3864">3</tspan><tspan font-size="26" fill="#8A95A1" dx="8">種</tspan></text><text x="930" y="712" font-size="22" font-weight="400" fill="#8A95A1" text-anchor="middle">記憶體架構分開算</text><line x1="1113" y1="584" x2="1113" y2="716" stroke="#C6D4E2" stroke-width="2"/><text x="1295" y="664" text-anchor="middle"><tspan font-size="68" font-weight="800" fill="#1F3864">2</tspan><tspan font-size="26" fill="#8A95A1" dx="8">種</tspan></text><text x="1295" y="712" font-size="22" font-weight="400" fill="#8A95A1" text-anchor="middle">推論引擎同一個畫面</text></svg>