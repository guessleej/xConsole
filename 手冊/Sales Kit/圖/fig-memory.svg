" text-anchor="start">每張卡各自算</text><rect x="270" y="434" width="268.0" height="50" rx="25" fill="#FFFFFF"/><text x="404.0" y="467" font-size="22" font-weight="700" fill="#1F3864" text-anchor="middle">每張顯示卡各自的顯存</text><rect x="554.0" y="434" width="224.0" height="50" rx="25" fill="#FFFFFF"/><text x="666.0" y="467" font-size="22" font-weight="700" fill="#1F3864" text-anchor="middle">系統記憶體另外算</text><rect x="794.0" y="434" width="197.59999999999997" height="50" rx="25" fill="#FFFFFF"/><text x="892.8" y="467" font-size="22" font-weight="700" fill="#1F3864" text-anchor="middle">顯存底線1 GiB</text><rect x="1007.5999999999999" y="434" width="197.59999999999997" height="50" rx="25" fill="#FFFFFF"/><text x="1106.3999999999999" y="467" font-size="22" font-weight="700" fill="#1F3864" text-anchor="middle">系統底線8 GiB</text><rect x="20" y="556" width="1420" height="194" rx="18" fill="#E8EDF3"/><text x="46" y="649.0" font-size="30" font-weight="700" fill="#1F3864" text-anchor="start">每次都算</text><text x="46" y="685.0" font-size="21" font-weight="400" fill="#3D4A57" text-anchor="start">啟動、換模型前</text><text x="850.0" y="663.0" font-size="26" font-weight="700" fill="#1F3864" text-anchor="middle">載下去之後最壞剩多少，低於底線就擋，並說明差多少</text></svg>