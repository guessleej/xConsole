<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xConsole 模型主控台｜云碩科技</title>
<meta name="description" content="云碩科技地端 AI 機群的模型主控台：角色欄位、記憶體准入控制、情境切換、即時監控。">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23bf181f'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='17' font-weight='bold' fill='white' text-anchor='middle'%3Ex%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" class="login-page" hidden>
  <div class="hero-glow"></div>
  <form class="login-card" id="login-form">
    <h1>xConsole 模型主控台</h1>
    <p>云碩科技地端 AI 機群</p>
    <label class="field" for="un">帳號</label>
    <input type="text" id="un" autocomplete="username" required value="admin">
    <label class="field" for="pw">密碼</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <div class="actions" style="justify-content:stretch;margin-top:16px">
      <button class="btn primary" type="submit" style="width:100%">登入</button>
    </div>
    <p id="login-err" class="small" style="color:var(--bad);margin-top:12px" hidden></p>
  </form>
</div>

<div id="app" hidden>
  <header class="topbar" id="topbar">
    <div class="topbar-row one">
      <div class="brand"><span class="brand-mark">x</span><span>xConsole</span></div>
      <nav class="nav" id="nav"></nav>
      <span class="spacer"></span>
      <span class="livedot" id="live"><i></i><span id="live-text">連線中</span></span>
      <button class="iconbtn" id="refresh" title="立即重新整理" aria-label="立即重新整理">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="iconbtn" id="theme" title="切換深淺色" aria-label="切換深淺色">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="iconbtn" id="logout" title="登出" aria-label="登出">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
    <div class="topbar-row two"><div class="subnav" id="subnav"></div></div>
  </header>

  <div id="tls-banner" class="banner" hidden></div>
  <main id="main"></main>
</div>

<div class="toasts" id="toasts"></div>
<div id="modal-host"></div>

<script src="app.js"></script>
</body>
</html>
