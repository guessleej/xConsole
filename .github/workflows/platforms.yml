# 三個作業系統都要能裝、能跑：Ubuntu、macOS（Apple Silicon）、Windows。
# 1. 跨平台自我檢查：硬體讀數、代理自己看管模型服務（沒有 systemd 的那條路）、推薦與准入公式、安裝腳本語法
# 2. 實際安裝：用 install/ 底下的安裝程式裝成開機自啟，經網頁 API 走完「裝引擎 → 下載模型 → 換上 → 問一句話」
name: platforms
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'          # Windows 的主控台預設 cp1252，測試印中文會例外

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  selftest:
    name: 跨平台自我檢查（${{ matrix.os }}／Python ${{ matrix.py }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, py: '3.12' }
          - { os: ubuntu-24.04, py: '3.9' }          # macOS 內建命令列工具的 Python 是 3.9，最低要支援到這裡
          - { os: macos-15, py: '3.12' }
          - { os: windows-2025, py: '3.12' }
    # Ubuntu 這幾項：同一儲存庫的 PR、push 走 .50 自建 runner，來自 fork 的 PR 留在 GitHub 代管機器；macOS、Windows 不能在 .50 跑，照舊
    runs-on: ${{ fromJSON(startsWith(matrix.os, 'ubuntu') && !github.event.pull_request.head.repo.fork && '["self-hosted","xconsole"]' || format('"{0}"', matrix.os)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '${{ matrix.py }}' }
      # 自建 runner 會重複使用 Python 工具快取：套件一律裝進這次新建的虛擬環境，用完隨暫存目錄清掉
      - name: 這次專用的虛擬環境（自建 runner）
        if: runner.environment == 'self-hosted'
        shell: bash
        run: python -m venv "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: 硬體讀數與代理自己看管模型服務
        run: python agent/test_platform.py
      - name: 准入試算
        run: python agent/test_admit.py
      - name: 代理主動連回（代理這一側：釘憑證、分片、串流、去重、取消）
        run: python agent/test_link.py
      - name: 群組設定對齊（代理這一側）
        run: python agent/test_group.py
      - name: 推薦清單
        run: python console/test_recommend.py
      - name: Intel 顯示卡、SSD 判斷、引擎續傳與手動匯入、畫圖參考圖與多張
        run: python agent/test_gaps.py
      - name: 對話附件抽文字（PDF、Word、Excel、PowerPoint、純文字）
        run: python console/test_extract.py
      - name: 安裝腳本產得出來、語法正確（Linux／macOS 的 bash 與 Windows 的 PowerShell）
        shell: bash
        run: |
          export XCONSOLE_HOME="$RUNNER_TEMP/render"
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "console")
          import xconsole_server as X
          j = {"console": "192.0.2.10:9400", "pin": "sha256//AAAA", "fp": "AB" * 32}
          d = os.environ["RUNNER_TEMP"]
          open(os.path.join(d, "agent.sh"), "w", encoding="utf-8").write(X.install_script("code123", j))
          open(os.path.join(d, "agent.ps1"), "w", encoding="utf-8-sig").write(X.install_script_ps1("code123", j))
          open(os.path.join(d, "oneline.ps1"), "w", encoding="utf-8-sig").write(X.windows_command("https://192.0.2.10:9400/install/x/agent.ps1"))
          PY
          bash -n "$RUNNER_TEMP/agent.sh"
          bash -n install/install.sh
          python -m py_compile install/join.py
      - name: PowerShell 語法檢查
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($f in @("install\install.ps1", "$env:RUNNER_TEMP\agent.ps1", "$env:RUNNER_TEMP\oneline.ps1")) {
            $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$err)
            if ($err) { $err | Format-List; throw "$f 有語法錯誤" } else { Write-Host "$f 語法正確" }
          }

  silent:
    name: 大量部署的靜默安裝（${{ matrix.os }}）
    # 用 root／系統管理員裝成開機自啟並加入主控台：Linux 專用帳號＋linger、macOS LaunchDaemon、Windows SYSTEM 排程
    needs: selftest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: 靜默安裝、加入、開機自啟的帳號、回應檔處理、移除
        run: python test/e2e_silent.py
      - name: 失敗時的記錄
        if: failure()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then f='C:\ProgramData\xConsole\.xconsole\agent.log'; tail -n 80 "$f" 2>/dev/null || true
          elif [ "$RUNNER_OS" = macOS ]; then sudo tail -n 80 /opt/xconsole/.xconsole/agent.log || true; sudo launchctl print system/tw.xcloudinfo.xconsole-agent | head -40 || true
          else sudo journalctl _SYSTEMD_USER_UNIT=xconsole-agent.service -n 80 --no-pager || true; fi
          true

  install:
    name: 實際安裝與驗收（${{ matrix.os }}）
    needs: selftest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    # Ubuntu 這幾項：同一儲存庫的 PR、push 走 .50 自建 runner，來自 fork 的 PR 留在 GitHub 代管機器；macOS、Windows 不能在 .50 跑，照舊
    runs-on: ${{ fromJSON(startsWith(matrix.os, 'ubuntu') && !github.event.pull_request.head.repo.fork && '["self-hosted","xconsole"]' || format('"{0}"', matrix.os)) }}
    # .50 上這一項會裝成 xcloud 帳號的 systemd 使用者服務（固定名稱、固定埠 9400／9401／9402）：同一時間只准跑一個
    concurrency:
      group: ${{ startsWith(matrix.os, 'ubuntu') && !github.event.pull_request.head.repo.fork && 'xconsole-50-install' || format('install-{0}-{1}', matrix.os, github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - name: 自建 runner：改回真正的家目錄，確認沒有正式安裝的 xConsole 才往下
        if: runner.environment == 'self-hosted'
        run: |
          # runner 平常用自己的家目錄隔開；systemd 使用者服務只讀真正家目錄底下的 ~/.config/systemd/user
          H=$(getent passwd "$(id -un)" | cut -d: -f6)
          echo "HOME=$H" >> "$GITHUB_ENV"
          if [ -e "$H/.xconsole/.ci-owned" ]; then
            echo "上一次 CI 沒收乾淨，先移除"
            HOME="$H" XDG_RUNTIME_DIR="/run/user/$(id -u)" bash install/install.sh --uninstall || true
            rm -rf "$H/.xconsole" "$H/xconsole" "$H/xconsole_agent.py"
          fi
          for p in "$H/xconsole" "$H/.config/systemd/user/xconsole.service" "$H/.config/systemd/user/xconsole-agent.service"; do
            [ -e "$p" ] && { echo "::error::這台已有不是 CI 裝的 xConsole（$p），CI 不覆蓋正式安裝"; exit 1; }
          done
          # 只有 ~/.xconsole：多半是 security 的整合測試正在跑（經 systemd --user 帶起的行程會建它，那一步結束就刪），等它收掉
          for i in $(seq 1 60); do [ -e "$H/.xconsole" ] || break; sleep 5; done
          [ -e "$H/.xconsole" ] && { echo "::error::$H/.xconsole 不是 CI 留下的（可能是正式安裝移除後保留的資料），CI 不動它"; exit 1; }
          true
      - name: 帳密檔（只在這次 CI 用，權限 600）
        shell: bash
        run: |
          umask 077
          printf 'admin\n%s\n' "$(python -c 'import secrets; print(secrets.token_urlsafe(18))')" > "$RUNNER_TEMP/pw"
      - name: 安裝（Ubuntu：systemd 使用者服務）
        if: runner.os == 'Linux'
        run: |
          U=$(id -un)
          [ "$(loginctl show-user "$U" -p Linger --value 2>/dev/null)" = yes ] || sudo loginctl enable-linger "$U"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for i in $(seq 1 20); do systemctl --user show-environment >/dev/null 2>&1 && break; sleep 1; done
          [ "$RUNNER_ENVIRONMENT" = self-hosted ] && mkdir -p "$HOME/.xconsole" && touch "$HOME/.xconsole/.ci-owned"
          bash install/install.sh --password-file "$RUNNER_TEMP/pw"
      - name: 安裝（macOS：launchd）
        if: runner.os == 'macOS'
        run: bash install/install.sh --password-file "$RUNNER_TEMP/pw"
      - name: 安裝（Windows：工作排程器，系統管理員身分＝開機自啟）
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install\install.ps1 -PasswordFile "$env:RUNNER_TEMP\pw"
      - name: 經網頁 API 驗收（Linux 的 llama.cpp 要在這台編譯，CI 上太久，只驗到下載模型）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then H='C:\ProgramData\xConsole'; else H="$HOME"; fi
          # 共用的 CI 機器不帶權杖很容易撞到 GitHub 一小時 60 次的上限：把這次工作的唯讀權杖放成檔案給代理用（用完機器就銷毀）
          mkdir -p "$H/.xconsole"; ( umask 077; printf "%s" "$GH_TOKEN" > "$H/.xconsole/github-token" )
          echo "權杖檔 $(wc -c < "$H/.xconsole/github-token") 位元組（不印內容）"
          SKIP=""; [ "$RUNNER_OS" = Linux ] && SKIP="--skip-engine"
          python test/e2e_install.py --home "$H" --password-file "$RUNNER_TEMP/pw" $SKIP
      - name: 失敗時的記錄
        if: failure()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then D='C:\ProgramData\xConsole\.xconsole'; else D="$HOME/.xconsole"; fi
          for f in agent.log console.log engines/build-llama-build.log engines/slot1-llama.log; do echo "===== $f"; tail -n 80 "$D/$f" 2>/dev/null || true; done
          [ "$RUNNER_OS" = Linux ] && { export XDG_RUNTIME_DIR="/run/user/$(id -u)"; journalctl --user -u xconsole-agent -u xconsole -n 80 --no-pager || true; }
          if [ "$RUNNER_OS" = macOS ]; then
            for d in "gui/$(id -u)" "user/$(id -u)"; do echo "===== launchctl print $d/tw.xcloudinfo.xconsole-agent"; launchctl print "$d/tw.xcloudinfo.xconsole-agent" 2>&1 | head -40 || true; done
          fi
          true
      - name: 移除
        if: always()
        shell: bash
        run: |
          # 自建 runner：只移除 CI 自己裝的那一份（有 .ci-owned）；前面檢查到正式安裝而停下時，這裡什麼都不動
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ] && [ ! -e "$HOME/.xconsole/.ci-owned" ]; then
            echo "這台的 xConsole 不是這次 CI 裝的，不移除"; rm -f "$RUNNER_TEMP/pw"; exit 0
          fi
          if [ "$RUNNER_OS" = Windows ]; then powershell -NoProfile -ExecutionPolicy Bypass -File install/install.ps1 -Uninstall
          else export XDG_RUNTIME_DIR="/run/user/$(id -u)"; bash install/install.sh --uninstall; fi
          rm -f "$RUNNER_TEMP/pw"
          # 自建 runner：連資料一起刪（含這次的權杖檔與下載的小模型），只刪 CI 自己裝的那一份
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ] && [ -e "$HOME/.xconsole/.ci-owned" ]; then
            rm -rf "$HOME/.xconsole" "$HOME/xconsole" "$HOME/xconsole_agent.py"
          fi
